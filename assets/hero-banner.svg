<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%">
  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="50%" stop-color="#111822" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="topBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#58A6FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2331" />
      <stop offset="100%" stop-color="#131822" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#30363D" opacity="0.55" />
    </pattern>
  </defs>

  <!-- Main Card -->
  <rect width="880" height="230" rx="12" fill="url(#surface)" stroke="#30363D" stroke-width="1.2" />
  <rect width="880" height="230" rx="12" fill="url(#dotGrid)" />

  <!-- Animated Top Laser Beam -->
  <rect x="0" y="0" width="880" height="2" fill="#21262D" />
  <rect x="80" y="0" width="320" height="2.5" rx="1.25" fill="url(#topBeam)">
    <animate attributeName="x" values="-100;660;-100" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- Animated Subtle Tech Circuit Lines Left & Right -->
  <g stroke="#30363D" stroke-width="1" fill="none" opacity="0.7">
    <path d="M 0 60 H 95 L 115 80 H 155" />
    <path d="M 880 60 H 785 L 765 80 H 725" />
    <circle cx="155" cy="80" r="3" fill="#58A6FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="725" cy="80" r="3" fill="#58A6FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Centered Content -->
  <text x="440" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F0F6FC" letter-spacing="1.2">AKHILESH RAVURI</text>

  <text x="440" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#58A6FF" letter-spacing="0.4">DevOps Engineer  ·  Full-Stack Software Developer</text>

  <text x="440" y="116" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8B949E">
    4+ Years Building Cloud-Native AWS Platforms, Automated CI/CD Pipelines, Microservices &amp; AI RAG Systems
  </text>

  <!-- Row 1 of Individual Tech Stack Boxes (6 boxes) -->
  <g transform="translate(86, 136)">
    <rect x="0" y="0" width="76" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="0s" repeatCount="indefinite" />
    </rect>
    <text x="38" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">AWS</text>

    <rect x="86" y="0" width="112" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="0.5s" repeatCount="indefinite" />
    </rect>
    <text x="142" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Terraform</text>

    <rect x="208" y="0" width="120" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="1s" repeatCount="indefinite" />
    </rect>
    <text x="268" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Kubernetes</text>

    <rect x="338" y="0" width="94" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="1.5s" repeatCount="indefinite" />
    </rect>
    <text x="385" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Docker</text>

    <rect x="442" y="0" width="98" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="2s" repeatCount="indefinite" />
    </rect>
    <text x="491" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Jenkins</text>

    <rect x="550" y="0" width="158" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="2.5s" repeatCount="indefinite" />
    </rect>
    <text x="629" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">RAG &amp; LLM APIs</text>
  </g>

  <!-- Row 2 of Individual Tech Stack Boxes (5 boxes) -->
  <g transform="translate(178, 176)">
    <rect x="0" y="0" width="94" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="3s" repeatCount="indefinite" />
    </rect>
    <text x="47" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Python</text>

    <rect x="104" y="0" width="76" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="3.5s" repeatCount="indefinite" />
    </rect>
    <text x="142" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">PHP</text>

    <rect x="190" y="0" width="106" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="4s" repeatCount="indefinite" />
    </rect>
    <text x="243" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">React.js</text>

    <rect x="306" y="0" width="100" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="4.5s" repeatCount="indefinite" />
    </rect>
    <text x="356" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Node.js</text>

    <rect x="416" y="0" width="96" height="30" rx="6" fill="url(#pillGrad)" stroke="#30363D" stroke-width="1.2">
      <animate attributeName="stroke" values="#30363D;#58A6FF;#30363D" dur="6s" begin="5s" repeatCount="indefinite" />
    </rect>
    <text x="464" y="19.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="600" fill="#E6EDF3">MySQL</text>
  </g>
</svg>
